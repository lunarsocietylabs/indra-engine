name: v4-export-once
# One-off: hardcoded run (workflow_dispatch inputs were not reaching the job).
# Writes V4 layer results from private R2 -> frontend JSON under data/v4-preview/.
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: export
        env:
          CF_R2_TOKEN: ${{ secrets.CF_R2_TOKEN }}
          CF_ACC_ID: ${{ secrets.CF_ACC_ID }}
        run: |
          set -euo pipefail
          echo "token_len=${#CF_R2_TOKEN} acc_len=${#CF_ACC_ID}"
          [ -n "${CF_R2_TOKEN:-}" ] && [ -n "${CF_ACC_ID:-}" ] || { echo "missing secrets"; exit 3; }
          python3 tools/export_v4_r2.py --tag 43175083562 --prefix data/v4-preview/ --allow-prod
