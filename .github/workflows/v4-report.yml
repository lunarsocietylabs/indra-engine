name: v4-report
on:
  workflow_dispatch:
    inputs:
      tag: {description: "batch run id", required: true}
      script: {description: "script name", default: "v4_report.py"}
permissions:
  id-token: write
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python3 .github/scripts/${{ inputs.script }} ${{ inputs.tag }}
