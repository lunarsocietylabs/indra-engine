name: v4-batch
# Manual only. Private source, plans, outputs and diagnostic logs never enter public checkout.
on:
  workflow_dispatch:
    inputs:
      site: {description: Corpus server base URL, required: true, default: "https://aicanon.omnisun.workers.dev"}
      plan_tag: {description: "Reuse plan from an earlier run id (empty = make a new plan)", default: ""}
      only: {description: "Comma-separated target ids (empty = all)", default: ""}
      nshards: {description: "Shards (1-8)", default: "8"}
      workers: {description: "Workers per shard (1-8)", default: "2"}
      plan_classes: {description: "Target classes for a new plan", default: "canon"}
      layer_tags: {description: "Layer-3: comma-separated earlier run tags", default: ""}
      unmatched_tag: {description: "Only texts left unmatched in this earlier run", default: ""}
      out_tag: {description: "Output folder tag (default: plan tag / run id)", default: ""}
permissions:
  id-token: write
  contents: read
env:
  INDRA_SITE: ${{ inputs.site }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  plan:
    if: inputs.plan_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet --no-input numpy requests
      - name: Fetch pinned public base and verify checkout
        run: |
          git fetch --no-tags --depth=1 origin 85762ae9f54501e6866ac797fb4996bd845f54bd
          python3 tools/check_public_boundary.py --scan-dir "$GITHUB_WORKSPACE"
      - name: Download private engine archive
        run: python3 .github/scripts/oidc_store.py engine
      - name: Assemble isolated private runtime
        run: |
          python3 tools/prepare_indra_runtime.py --public-root "$GITHUB_WORKSPACE" --private-archive "$INDRA_PRIVATE_ARCHIVE" --output "$RUNNER_TEMP/indra-runtime" --manifest architecture/indra-runtime.json --github-env "$GITHUB_ENV"
      - name: Prepare plan and retain detailed logs privately
        env:
          UNMATCHED_TAG: ${{ inputs.unmatched_tag }}
          LAYER_TAGS: ${{ inputs.layer_tags }}
          PLAN_CLASSES: ${{ inputs.plan_classes }}
        run: python3 .github/scripts/run_private_job.py plan
      - name: Clean private runtime even if environment export failed
        if: always()
        run: python3 tools/cleanup_indra_runtime.py
      - name: Verify public checkout was not contaminated
        if: always()
        run: python3 tools/check_public_boundary.py --scan-dir "$GITHUB_WORKSPACE"
  shards:
    needs: plan
    if: always() && (needs.plan.result == 'success' || needs.plan.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: {shard: [0, 1, 2, 3, 4, 5, 6, 7]}
    steps:
      - name: Validate shard limit and skip unused shard
        id: gate
        env:
          NSHARDS: ${{ inputs.nshards }}
          SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PYTHON'
          import os
          n = int(os.environ['NSHARDS'])
          if not 1 <= n <= 8:
              raise SystemExit('Shards must be between 1 and 8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('go=' + ('1' if int(os.environ['SHARD']) < n else '0') + '\n')
          PYTHON
      - if: steps.gate.outputs.go == '1'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == '1'
        uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - if: steps.gate.outputs.go == '1'
        run: pip install --quiet --no-input numpy requests
      - name: Fetch pinned public base and verify checkout
        if: steps.gate.outputs.go == '1'
        run: |
          git fetch --no-tags --depth=1 origin 85762ae9f54501e6866ac797fb4996bd845f54bd
          python3 tools/check_public_boundary.py --scan-dir "$GITHUB_WORKSPACE"
      - name: Download private engine archive
        if: steps.gate.outputs.go == '1'
        run: python3 .github/scripts/oidc_store.py engine
      - name: Assemble isolated private runtime
        if: steps.gate.outputs.go == '1'
        run: |
          python3 tools/prepare_indra_runtime.py --public-root "$GITHUB_WORKSPACE" --private-archive "$INDRA_PRIVATE_ARCHIVE" --output "$RUNNER_TEMP/indra-runtime" --manifest architecture/indra-runtime.json --github-env "$GITHUB_ENV"
      - name: Run shard and store outputs/logs privately
        if: steps.gate.outputs.go == '1'
        env:
          PLAN_TAG: ${{ inputs.plan_tag }}
          OUT_TAG: ${{ inputs.out_tag }}
          NSHARDS: ${{ inputs.nshards }}
          SHARD: ${{ matrix.shard }}
          ONLY: ${{ inputs.only }}
          WORKERS: ${{ inputs.workers }}
        run: python3 .github/scripts/run_private_job.py batch
      - name: Clean private runtime even if environment export failed
        if: always() && steps.gate.outputs.go == '1'
        run: python3 tools/cleanup_indra_runtime.py
      - name: Verify public checkout was not contaminated
        if: always() && steps.gate.outputs.go == '1'
        run: python3 tools/check_public_boundary.py --scan-dir "$GITHUB_WORKSPACE"
