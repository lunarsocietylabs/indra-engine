name: v4-batch
# Manual only. Whole-canon V4 batch on free public minutes. Private engine + outputs live in private storage; logs carry only ok/fail lines.
on:
  workflow_dispatch:
    inputs:
      site: {description: Corpus server base URL, required: true, default: "https://aicanon.omnisun.workers.dev"}
      plan_tag: {description: "Reuse plan from an earlier run id (empty = make a new plan)", default: ""}
      only: {description: "Comma-separated target ids (empty = all)", default: ""}
      nshards: {description: "Shards", default: "8"}
      workers: {description: "Workers per shard", default: "2"}
permissions:
  id-token: write
  contents: read
env:
  INDRA_SITE: ${{ inputs.site }}
jobs:
  plan:
    if: inputs.plan_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet --no-input numpy requests
      - run: python3 .github/scripts/oidc_store.py engine
      - run: |
          find /tmp/eng_pkg -path '*indra/*.py' -exec cp {} indra/ \;
          python3 -m indra.v4_plan --out /tmp/plan >/tmp/plan.log 2>&1 || { tail -3 /tmp/plan.log | cut -c1-160; exit 1; }
          python3 .github/scripts/oidc_store.py put /tmp/plan/plan.json engine-v4-out/${{ github.run_id }}/plan.json
          echo "plan ok: $(python3 -c 'import json;print(len(json.load(open("/tmp/plan/plan.json"))["families"]))') families"
  shards:
    needs: plan
    if: always() && (needs.plan.result == 'success' || needs.plan.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: {shard: [0, 1, 2, 3, 4, 5, 6, 7]}
    steps:
      - name: skip unused shard
        id: gate
        run: '[ "${{ matrix.shard }}" -lt "${{ inputs.nshards }}" ] && echo go=1 >> $GITHUB_OUTPUT || echo go=0 >> $GITHUB_OUTPUT'
      - if: steps.gate.outputs.go == '1'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == '1'
        uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - if: steps.gate.outputs.go == '1'
        run: pip install --quiet --no-input numpy requests
      - if: steps.gate.outputs.go == '1'
        run: |
          python3 .github/scripts/oidc_store.py engine
          find /tmp/eng_pkg -path '*indra/*.py' -exec cp {} indra/ \;
          python3 .github/scripts/oidc_store.py get engine-v4-out/${{ inputs.plan_tag || github.run_id }}/plan.json /tmp/plan.json
      - if: steps.gate.outputs.go == '1'
        run: python3 -m indra.v4_batch --plan /tmp/plan.json --shard ${{ matrix.shard }} --nshards ${{ inputs.nshards }} --only "${{ inputs.only }}" --workers ${{ inputs.workers }} --out /tmp/outgz 2>&1 | grep -E " ok | FAILED |^shard " 
      - if: always() && steps.gate.outputs.go == '1'
        run: python3 .github/scripts/oidc_store.py putdir /tmp/outgz engine-v4-out/${{ inputs.plan_tag || github.run_id }}/
