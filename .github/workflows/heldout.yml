name: heldout
# Manual only. Held-out test with frozen v3 parameters on sutras never used for tuning. Report goes to the Job Summary.
on:
  workflow_dispatch:
    inputs:
      site:
        description: Corpus server base URL
        required: true
        default: https://aicanon.omnisun.workers.dev
      variants:
        description: Unify variant characters via Unicode Unihan (kZVariant + kSemanticVariant)
        type: boolean
        default: false
concurrency: {group: "${{ github.workflow }}-${{ github.ref }}-${{ inputs.variants }}", cancel-in-progress: true}
jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet --no-input numpy requests
      - run: python3 -m indra.suffix_experiment --selftest
      - if: ${{ inputs.variants }}
        run: |
          curl -fsSL -o /tmp/Unihan.zip https://www.unicode.org/Public/16.0.0/ucd/Unihan.zip
          unzip -o -q /tmp/Unihan.zip Unihan_Variants.txt -d /tmp/unihan
          echo "INDRA_VARIANTS=/tmp/unihan/Unihan_Variants.txt" >> "$GITHUB_ENV"
      - run: mkdir -p /tmp/ho && INDRA_SITE="${{ inputs.site }}" python3 -m indra.heldout --out /tmp/ho
      - run: cat /tmp/ho/report.md >> "$GITHUB_STEP_SUMMARY"
