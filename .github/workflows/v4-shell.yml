name: v4-shell
# Manual only. Free public-repo minutes; private engine fetched via OIDC from private storage and never printed.
on:
  workflow_dispatch:
    inputs:
      site: {description: Corpus server base URL, required: true, default: "https://aicanon.omnisun.workers.dev"}
      only: {description: "Families or extra ids; empty = all", default: "heart"}
      extra: {description: "Extra target(s) fam:ID:titlekeyword[,..]", default: ""}
      workers: {description: "Parallel workers", default: "4"}
permissions:
  id-token: write
  contents: read
concurrency: {group: "v4-shell-${{ inputs.only }}-${{ inputs.extra }}", cancel-in-progress: true}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet --no-input numpy requests
      - name: Fetch private engine (quiet)
        run: python3 .github/scripts/fetch_engine.py
      - name: Overlay
        run: |
          find /tmp/eng_pkg -path '*indra/*.py' -exec cp {} indra/ \;
          mkdir -p tests && touch tests/__init__.py && find /tmp/eng_pkg -path '*tests/*.py' -exec cp {} tests/ \;
          rm -rf /tmp/eng_pkg
      - run: python3 -m tests.test_v4_locate >/dev/null && python3 -m tests.test_v4_modules >/dev/null && echo "self-tests pass"
      - name: Run (output kept off the public log)
        env: {INDRA_SITE: "${{ inputs.site }}"}
        run: |
          python3 -m indra.v4_run --out /tmp/v4 --only "${{ inputs.only }}" --extra "${{ inputs.extra }}" --workers "${{ inputs.workers }}" >/tmp/run.log 2>&1 || { echo "run failed; last lines:"; tail -5 /tmp/run.log | cut -c1-160; exit 1; }
          echo "run ok; $(ls /tmp/v4 | wc -l) output files"
