name: v4-shell
# Manual only. Public standard Runner; private source/runtime/logs remain outside checkout.
on:
  workflow_dispatch:
    inputs:
      site: {description: Corpus server base URL, required: true, default: "https://aicanon.omnisun.workers.dev"}
      only: {description: "Families or extra ids; empty = all", default: "heart"}
      extra: {description: "Extra target(s) fam:ID:titlekeyword[,..]", default: ""}
      workers: {description: "Parallel workers (1-8)", default: "4"}
permissions:
  id-token: write
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
concurrency: {group: "v4-shell-${{ inputs.only }}-${{ inputs.extra }}", cancel-in-progress: true}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet --no-input numpy requests
      - name: Fetch pinned public base and verify checkout
        run: |
          git fetch --no-tags --depth=1 origin 85762ae9f54501e6866ac797fb4996bd845f54bd
          python3 tools/check_public_boundary.py --scan-dir "$GITHUB_WORKSPACE"
      - name: Download private engine without extracting into checkout
        run: python3 .github/scripts/fetch_engine.py
      - name: Assemble isolated private runtime
        run: |
          python3 tools/prepare_indra_runtime.py --public-root "$GITHUB_WORKSPACE" --private-archive "$INDRA_PRIVATE_ARCHIVE" --output "$RUNNER_TEMP/indra-runtime" --manifest architecture/indra-runtime.json --github-env "$GITHUB_ENV"
      - name: Run private tests and selected families
        env:
          INDRA_SITE: ${{ inputs.site }}
          ONLY: ${{ inputs.only }}
          EXTRA: ${{ inputs.extra }}
          WORKERS: ${{ inputs.workers }}
        run: python3 .github/scripts/run_private_job.py shell
      - name: Clean private runtime even if environment export failed
        if: always()
        run: python3 tools/cleanup_indra_runtime.py
      - name: Verify public checkout was not contaminated
        if: always()
        run: python3 tools/check_public_boundary.py --scan-dir "$GITHUB_WORKSPACE"
