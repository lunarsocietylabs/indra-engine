name: oidc-probe
# Manual diagnostic. Prints only HTTP codes and JSON key names, never values.
on: {workflow_dispatch: {}}
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        run: |
          set +x
          for AUD in "https://lunarsocietylabs.com"; do
            J=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
            echo "::add-mask::$J"
            echo "jwt_len=${#J} aud=$AUD"
            python3 - "$J" <<'P'
          import sys,base64,json
          p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p)); print({k:c[k] for k in ('iss','aud','sub','repository','ref','job_workflow_ref') if k in c})
          P
            for EP in storage-token; do
              for K in jwt token id_token oidc_token oidc jwt_token; do
                R=$(curl -s -m 20 -o /tmp/r.json -w '%{http_code}' -X POST -H "Content-Type: application/json" -d "{\"$K\":\"$J\"}" "https://lunarsocietylabs.com/mcp/oidc/$EP")
                echo "$EP body-key=$K -> $R msg: $(head -c 200 /tmp/r.json | sed -E 's/[A-Za-z0-9_-]{40,}/<redacted>/g')"
              done
              R=$(curl -s -m 20 -o /tmp/r.json -w '%{http_code}' -X POST -H "X-OIDC-Token: $J" -d '{}' "https://lunarsocietylabs.com/mcp/oidc/$EP")
              echo "$EP header X-OIDC-Token -> $R msg: $(head -c 200 /tmp/r.json | sed -E 's/[A-Za-z0-9_-]{40,}/<redacted>/g')"
              R=$(curl -s -m 20 -o /tmp/r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $J" "https://lunarsocietylabs.com/mcp/oidc/$EP")
              echo "$EP bearer-nobody -> $R msg: $(head -c 200 /tmp/r.json | sed -E 's/[A-Za-z0-9_-]{40,}/<redacted>/g')"
            done
          done
