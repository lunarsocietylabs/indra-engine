name: oidc-probe
# Manual diagnostic. Prints only HTTP codes and short error text, never tokens.
on: {workflow_dispatch: {}}
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        run: |
          set +x
          for AUD in lunarsocietylabs https://lunarsocietylabs.com/mcp https://lunarsocietylabs.com/mcp/oidc https://lunarsocietylabs.com/mcp/oidc/storage-token lunarsocietylabs.com/mcp lst-storage storage-gateway storage-mcp lst-private-docs lst-agent-bus lunarsocietylabs/indra-engine https://github.com/lunarsocietylabs https://github.com/lunarsocietylabs/indra-engine sts.lunarsocietylabs.com https://lunarsocietylabs.com/ lst-oidc lst; do
            J=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" --get --data-urlencode "audience=$AUD" "$ACTIONS_ID_TOKEN_REQUEST_URL" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
            echo "::add-mask::$J"
            R=$(curl -s -m 20 -o /tmp/r.json -w '%{http_code}' -X POST -H "Content-Type: application/json" -d "{\"token\":\"$J\"}" "https://lunarsocietylabs.com/mcp/oidc/storage-token")
            echo "aud=$AUD -> $R $(head -c 160 /tmp/r.json | sed -E 's/[A-Za-z0-9_-]{40,}/<redacted>/g')"
          done
