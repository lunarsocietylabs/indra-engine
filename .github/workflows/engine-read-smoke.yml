name: engine-read-smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: diagnose token permissions
        env:
          T: ${{ secrets.ENGINE_READ_TOKEN }}
        run: |
          set -u
          REPO=lunarsocietylabs/zelizuli.com
          echo "token_len=${#T}"
          for ep in "" "/contents" "/contents/README.md" "/git/trees/main?recursive=1"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" "https://api.github.com/repos/$REPO$ep")
            echo "api ${ep:-/repo} -> $code"
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" "https://api.github.com/repos/$REPO/readme")
          echo "api /readme -> $code"
          git clone -q --depth 1 "https://x-access-token:$T@github.com/$REPO.git" /tmp/src 2>&1 | sed 's/x-access-token:[^@]*@/x-access-token:***@/' | tail -3 || true
          if [ -d /tmp/src/.git ]; then echo "clone_ok=yes"; else echo "clone_ok=no"; fi
