name: engine-read-smoke
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: oidc token + two requests
        run: |
          set -u
          OIDC=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lunarsocietylabs-model-keys" | jq -r .value)
          ST=$(curl -s -X POST https://lunarsocietylabs.com/mcp/oidc/storage-token -H 'content-type: application/json' -d "{\"token\":\"$OIDC\"}")
          TOK=$(echo "$ST" | jq -r '.token // empty')
          echo "agent=$(echo "$ST" | jq -r .agent)"
          echo "token_len=${#TOK}"
          URL="https://lunarsocietylabs.com/lst-private-docs/docs/code-sync/lunarsocietylabs/indra-engine/probe.txt"
          echo "oidc-sync-probe-v2" > p.txt
          B1=$(curl -s -X PUT -H "Authorization: Bearer $TOK" -H 'x-content-type: text/plain' --data-binary @p.txt "$URL")
          echo "put_body=$(echo $B1 | head -c 160)"
          sleep 2
          B2=$(curl -s -H "Authorization: Bearer $TOK" "$URL")
          echo "get_body=$(echo $B2 | head -c 160)"
          B3=$(curl -s -X PUT -H "Authorization: Bearer $TOK" -H 'x-content-type: text/plain' --data-binary @p.txt "$URL")
          echo "put2_body=$(echo $B3 | head -c 160)"
